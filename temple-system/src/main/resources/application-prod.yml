server:
  port: 8080

# 数据库配置
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/temple_system?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 111111
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      validation-query: SELECT 1
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Redis配置
  data:
    redis:
      host: redis
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
      repositories:
        enabled: false
  web:
    resources:
      add-mappings: true # 开启静态资源映射, 否则 doc.html 404 错误

# 安全配置 - 白名单设置
security:
  ignore-urls:
    - /auth/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /doc.html
    - /v3/api-docs/**
    - /webjars/**
    - /actuator/**
    - /error
    - /static/**
    - /public/**

# 日志配置
logging:
  level:
    root: info
    dev.cj.temple: info
    org.springframework.web: info
    org.hibernate: info
  file:
    name: /app/logs/temple-system.log
    max-size: 100MB
    max-history: 30
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: dev.cj.temple

# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
  production: false
  basic:
    enable: false

# Actuator 健康检查配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

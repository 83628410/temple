# Redis 配置文件

# 绑定地址（允许所有IP访问，生产环境建议设置为特定IP）
bind 0.0.0.0

# 端口
port 6379

# 守护进程模式
daemonize no

# 日志级别
loglevel notice

# 日志文件位置
logfile ""

# 数据库数量
databases 16

# 密码（可选，建议在生产环境设置）
# requirepass your_password

# 连接超时时间（秒）
timeout 300

# TCP keepalive
tcp-keepalive 300

# 最大内存限制（可选）
# maxmemory 256mb

# 内存淘汰策略
# maxmemory-policy noeviction

# AOF持久化配置
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# RDB持久化配置
save 900 1
save 300 10
save 60 10000

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

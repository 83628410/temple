version: '3.8'

services:
  # 前端应用服务
  temple-web:
    build:
      context: ../../temple-system-web
      dockerfile: ../docker/frontend/Dockerfile
    container_name: temple-web
    restart: always
    ports:
      - "80:80"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - temple-system
    networks:
      - temple-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 后端应用服务（引用backend的docker-compose）
  temple-system:
    image: temple-system:latest
    container_name: temple-system
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/temple_system?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 111111
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - temple-network

  # MySQL 服务
  mysql:
    image: mysql:8.0.33
    container_name: temple-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 111111
      MYSQL_DATABASE: temple_system
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_general_ci
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --max_connections=1000
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p111111"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - temple-network

  # Redis 服务
  redis:
    image: redis:7-alpine
    container_name: temple-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - temple-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  temple-network:
    driver: bridge
